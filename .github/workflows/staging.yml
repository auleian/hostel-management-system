name: Build and Push Docker Image

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        run: echo "dckr_pat_oOp6ZiPXnY-S5plUz8MxJ_Q8fWw" | docker login -u "nessimntambi" --password-stdin

      - name: Build and push frontend image
        uses: docker/build-push-action@v2
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: nessimntambi/hostelmanagement:dev
          build-args: |
            NODE_ENV=production
            VITE_API_BASE_URL=https://hostelmanagementapi-dev.onrender.com/api

      - name: Build and push api image
        uses: docker/build-push-action@v2
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: nessimntambi/hostelmanagementapi:dev
